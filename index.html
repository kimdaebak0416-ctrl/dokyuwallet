<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>우리 둘만의 가계부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .safe-bottom-nav {
      padding-bottom: max(1.2rem, env(safe-area-inset-bottom, 1.2rem));
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-28">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-3 py-2 flex justify-between items-center shadow-xs">
    <div class="flex items-center gap-1.5">
      <h1 class="text-base font-bold text-slate-900 tracking-tight">가계부</h1>
      <span id="syncStatusBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-medium">동기화 중</span>
      <button onclick="location.reload()" title="새로고침" class="p-1 hover:bg-slate-100 active:bg-slate-200 text-slate-600 rounded transition flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="openNewTxModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded font-semibold shadow-xs transition">
        + 내역 추가
      </button>
      <button onclick="switchTab('settings')" class="p-1.5 text-slate-500 hover:bg-slate-100 rounded">
        ⚙️
      </button>
    </div>
  </header>

  <!-- 메인 탭 컨테이너 -->
  <main class="max-w-xl mx-auto p-2 space-y-2">

    <!-- 1. 달력 탭 -->
    <section id="tab-calendar" class="space-y-2">
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 overflow-hidden">
        
        <!-- 달력 연월 좌우 전환 바 -->
        <div class="flex justify-between items-center px-3 py-2 border-b border-slate-100">
          <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-100 rounded font-bold text-slate-600 text-sm">&lt;</button>
          <button onclick="openMonthPickerModal()" class="font-bold text-sm text-slate-800 hover:text-blue-600 flex items-center gap-1">
            <span id="calendarSectionTitle">2026년 11월</span>
            <span class="text-[10px] text-slate-400">▼</span>
          </button>
          <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-100 rounded font-bold text-slate-600 text-sm">&gt;</button>
        </div>

        <!-- 월간 종합 요약 바 -->
        <div class="grid grid-cols-3 text-center py-1.5 bg-slate-50 border-b border-slate-200 text-xs">
          <div>
            <span class="text-[10px] text-slate-400 block font-medium">수입</span>
            <span class="text-xs font-bold text-blue-600" id="monthSumIncome">0</span>
          </div>
          <div class="border-x border-slate-200">
            <span class="text-[10px] text-slate-400 block font-medium">지출</span>
            <span class="text-xs font-bold text-rose-600" id="monthSumExpense">0</span>
          </div>
          <div>
            <span class="text-[10px] text-slate-400 block font-medium">합계</span>
            <span class="text-xs font-bold text-slate-700" id="monthSumNet">0</span>
          </div>
        </div>

        <!-- 요일 헤더 -->
        <div class="grid grid-cols-7 text-center text-[10px] font-semibold text-slate-400 py-1 border-b border-slate-100">
          <div class="text-rose-500">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="text-blue-500">토</div>
        </div>

        <!-- 날짜 그리드 -->
        <div id="calendarGrid" class="grid grid-cols-7 divide-x divide-y divide-slate-100 border-b border-slate-100"></div>
      </div>

      <!-- 선택된 날짜 상세 내역 목록 -->
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3">
        <div class="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
          <div>
            <h3 id="selectedDateTitle" class="text-xs font-bold text-slate-800">오늘의 내역</h3>
            <span id="selectedDateCount" class="text-[10px] text-slate-400 mt-0.5 block">0건</span>
          </div>
          <div id="selectedDateSummary" class="text-right text-[11px] space-y-0.5"></div>
        </div>
        <div id="selectedDateList" class="divide-y divide-slate-100 text-xs space-y-0.5"></div>
      </div>
    </section>

    <!-- 2. 내역 탭 -->
    <section id="tab-list" class="space-y-2 hidden">
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-2.5 space-y-2">
        <div class="flex justify-between items-center px-1">
          <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-100 rounded font-bold text-slate-600 text-xs">&lt;</button>
          <button onclick="openMonthPickerModal()" class="text-xs font-bold text-slate-800 hover:text-blue-600 flex items-center gap-1">
            <span id="listMonthTitle">2026년 11월 내역</span>
            <span class="text-[10px] text-slate-400">▼</span>
          </button>
          <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-100 rounded font-bold text-slate-600 text-xs">&gt;</button>
        </div>
        
        <select id="listTypeFilter" onchange="renderListView()" class="bg-slate-50 border border-slate-200 rounded text-xs px-2.5 py-1.5 w-full">
          <option value="ALL">전체 유형 (수입/지출/이체)</option>
          <option value="expense">지출만</option>
          <option value="income">수입만</option>
          <option value="transfer">이체만</option>
        </select>
      </div>

      <div id="fullTransactionList" class="bg-white rounded-lg shadow-xs border border-slate-200 divide-y divide-slate-100 overflow-hidden"></div>
    </section>

    <!-- 3. 통계 탭 -->
    <section id="tab-stats" class="space-y-2 hidden">
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3 space-y-2">
        <div class="flex justify-between items-center border-b border-slate-100 pb-2 px-1">
          <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-100 rounded font-bold text-slate-600 text-xs">&lt;</button>
          <button onclick="openMonthPickerModal()" class="font-bold text-sm text-slate-800 hover:text-blue-600 flex items-center gap-1">
            <span id="statsSectionTitle">2026년 11월</span>
            <span class="text-[10px] text-slate-400">▼</span>
          </button>
          <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-100 rounded font-bold text-slate-600 text-xs">&gt;</button>
        </div>

        <div class="grid grid-cols-3 gap-1.5 text-center pt-0.5">
          <div class="bg-blue-50 p-2 rounded">
            <span class="text-[10px] text-blue-600 block font-medium">수입</span>
            <span class="text-xs font-bold text-blue-700" id="statsTotalIncome">0원</span>
          </div>
          <div class="bg-rose-50 p-2 rounded">
            <span class="text-[10px] text-rose-600 block font-medium">지출</span>
            <span class="text-xs font-bold text-rose-700" id="statsTotalExpense">0원</span>
          </div>
          <div class="bg-emerald-50 p-2 rounded">
            <span class="text-[10px] text-emerald-600 block font-medium">순저축</span>
            <span class="text-xs font-bold text-emerald-700" id="statsNetSavings">0원</span>
          </div>
        </div>
      </div>

      <!-- 인터랙티브 그래프 카드 (디폴트: 잔액만 켜짐) -->
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3 space-y-2.5">
        <div class="flex justify-between items-center pb-2 border-b border-slate-100">
          <div>
            <h3 class="text-xs font-bold text-slate-800">자산 흐름 분석</h3>
            <p class="text-[10px] text-slate-400" id="chartSubtitleInfo">기간별 추이</p>
          </div>
          
          <div class="inline-flex rounded bg-slate-100 p-0.5 text-xs font-semibold">
            <button onclick="setChartPeriod('daily')" id="btnPeriodDaily" class="px-2 py-0.5 rounded bg-white text-slate-800 shadow-xs transition text-[11px]">일별</button>
            <button onclick="setChartPeriod('monthly')" id="btnPeriodMonthly" class="px-2 py-0.5 rounded text-slate-500 hover:text-slate-800 transition text-[11px]">월별</button>
            <button onclick="setChartPeriod('yearly')" id="btnPeriodYearly" class="px-2 py-0.5 rounded text-slate-500 hover:text-slate-800 transition text-[11px]">연별</button>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <label class="text-[11px] text-slate-500 font-medium whitespace-nowrap">자산:</label>
          <select id="chartAssetSelect" onchange="renderStatsChart()" class="bg-slate-50 border border-slate-200 rounded text-xs px-2 py-1 flex-1 font-semibold text-slate-700"></select>
        </div>

        <!-- 항목 토글 버튼 (잔액만 디폴트 ON) -->
        <div class="flex items-center gap-1 pt-0.5">
          <span class="text-[10px] text-slate-400 mr-0.5 font-medium">항목:</span>
          <button onclick="toggleChartDataset('income')" id="toggleBtnIncome" class="px-2 py-0.5 rounded text-[10px] font-bold border border-slate-200 bg-slate-50 text-slate-400 transition">
            수입
          </button>
          <button onclick="toggleChartDataset('expense')" id="toggleBtnExpense" class="px-2 py-0.5 rounded text-[10px] font-bold border border-slate-200 bg-slate-50 text-slate-400 transition">
            지출
          </button>
          <button onclick="toggleChartDataset('balance')" id="toggleBtnBalance" class="px-2 py-0.5 rounded text-[10px] font-bold border border-emerald-500 bg-emerald-50 text-emerald-600 transition">
            ✓ 잔액
          </button>
        </div>

        <div class="relative w-full h-64 pt-1">
          <canvas id="financeChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 4. 자산 관리 탭 -->
    <section id="tab-assets" class="space-y-2 hidden">
      <div class="bg-slate-900 text-white rounded-lg p-3.5 shadow-xs">
        <div class="flex justify-between items-center">
          <div>
            <span class="text-[10px] text-slate-400 block">우리 순자산 총액</span>
            <span id="totalAssetSum" class="text-xl font-bold tracking-tight">0원</span>
          </div>
          <button onclick="openModal('assetModal')" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-1.5 rounded transition font-medium border border-white/10">
            + 자산 추가
          </button>
        </div>
      </div>

      <div id="assetsCategoryGroups" class="space-y-2"></div>
    </section>

    <!-- 5. 설정 탭 -->
    <section id="tab-settings" class="space-y-2.5 hidden">
      
      <!-- 지출 카테고리 관리 -->
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3 space-y-2">
        <h3 class="text-xs font-bold text-slate-800">지출 카테고리 관리</h3>
        <div class="flex gap-1.5">
          <input type="text" id="newExpenseCatInput" placeholder="새 지출 카테고리 (예: 육아)" class="border border-slate-200 rounded p-1.5 text-xs flex-1">
          <button onclick="addCategory('expense')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded font-medium">추가</button>
        </div>
        <div id="settingsExpenseCatList" class="flex flex-wrap gap-1 pt-1"></div>
      </div>

      <!-- 수입 카테고리 관리 -->
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3 space-y-2">
        <h3 class="text-xs font-bold text-slate-800">수입 카테고리 관리</h3>
        <div class="flex gap-1.5">
          <input type="text" id="newIncomeCatInput" placeholder="새 수입 카테고리 (예: 배당금)" class="border border-slate-200 rounded p-1.5 text-xs flex-1">
          <button onclick="addCategory('income')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded font-medium">추가</button>
        </div>
        <div id="settingsIncomeCatList" class="flex flex-wrap gap-1 pt-1"></div>
      </div>

      <!-- [업그레이드] 자산 순서 이동 및 정보/카테고리 수정 관리 -->
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3">
        <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-100">
          <div>
            <h3 class="text-xs font-bold text-slate-800">등록된 전체 자산 관리</h3>
            <p class="text-[10px] text-slate-400">화살표(▲▼)로 순서를 변경하면 자산 탭에 즉시 반영됩니다.</p>
          </div>
          <button onclick="openModal('assetModal')" class="text-[11px] text-blue-600 font-semibold shrink-0">+ 자산 추가</button>
        </div>
        <div id="settingsAssetManageList" class="divide-y divide-slate-100 text-xs"></div>
      </div>

      <!-- CSV 백업 및 복원 -->
      <div class="bg-white rounded-lg shadow-xs border border-slate-200 p-3 space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-800">데이터 백업 및 복원 (CSV)</h3>
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 font-semibold">CSV 관리</span>
        </div>
        <p class="text-[11px] text-slate-500 leading-tight">
          거래 내역을 엑셀용 CSV 파일로 다운로드하거나 백업 파일을 불러옵니다.
        </p>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="exportToCSV()" class="w-full py-2 px-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded text-xs font-semibold flex items-center justify-center gap-1 shadow-xs transition">
            <span>📥</span>
            <span>CSV 내보내기</span>
          </button>
          <label class="w-full py-2 px-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded text-xs font-semibold flex items-center justify-center gap-1 shadow-xs transition cursor-pointer text-center">
            <span>📤</span>
            <span>CSV 가져오기</span>
            <input type="file" id="csvFileInput" accept=".csv" onchange="importFromCSV(event)" class="hidden">
          </label>
        </div>
      </div>
    </section>

  </main>

  <!-- 하단 고정 탭 바 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 pt-2 safe-bottom-nav flex justify-between items-center max-w-xl mx-auto z-20 shadow-md">
    <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center text-blue-600 transition">
      <span class="text-base">📅</span>
      <span class="text-[10px] font-semibold mt-0.5">달력</span>
    </button>
    <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center text-slate-400 transition">
      <span class="text-base">📝</span>
      <span class="text-[10px] font-semibold mt-0.5">내역</span>
    </button>
    <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center text-slate-400 transition">
      <span class="text-base">📊</span>
      <span class="text-[10px] font-semibold mt-0.5">통계</span>
    </button>
    <button onclick="switchTab('assets')" id="nav-assets" class="flex flex-col items-center text-slate-400 transition">
      <span class="text-base">💳</span>
      <span class="text-[10px] font-semibold mt-0.5">자산</span>
    </button>
  </nav>

  <!-- 연·월 고속 이동 팝업 픽커 모달 -->
  <div id="monthPickerModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 text-white w-full max-w-xs rounded-xl p-4 shadow-2xl space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800 text-xs">
        <span class="text-slate-400 font-medium">날짜 선택</span>
        <div class="flex items-center gap-3">
          <button onclick="jumpToCurrentMonth()" class="text-slate-300 hover:text-white font-semibold">이번 달</button>
          <button onclick="closeModal('monthPickerModal')" class="text-slate-400 hover:text-white text-base">✕</button>
        </div>
      </div>

      <div class="flex justify-between items-center px-4 py-0.5">
        <button onclick="changePickerYear(-1)" class="p-1 text-slate-400 hover:text-white font-bold text-base">&lt;</button>
        <span id="pickerYearTitle" class="text-sm font-bold text-white tracking-wide">2026년</span>
        <button onclick="changePickerYear(1)" class="p-1 text-slate-400 hover:text-white font-bold text-base">&gt;</button>
      </div>

      <div class="grid grid-cols-4 gap-1.5 pt-1" id="pickerMonthGrid"></div>
    </div>
  </div>

  <!-- 거래 추가 / 수정 모달 (자동완성 datalist 연동) -->
  <div id="txModal" class="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-xl p-4 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 id="txModalTitle" class="text-sm font-bold text-slate-900">가계부 기록</h3>
        <button onclick="closeModal('txModal')" class="text-slate-400 hover:text-slate-600 text-base font-bold">✕</button>
      </div>

      <input type="hidden" id="editingTxId" value="">

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-lg text-xs font-semibold">
        <button type="button" onclick="setTxType('expense')" id="typeBtnExpense" class="py-1.5 rounded bg-white text-rose-600 shadow-xs">지출</button>
        <button type="button" onclick="setTxType('income')" id="typeBtnIncome" class="py-1.5 rounded text-slate-500">수입</button>
        <button type="button" onclick="setTxType('transfer')" id="typeBtnTransfer" class="py-1.5 rounded text-slate-500">이체</button>
      </div>

      <form id="txForm" onsubmit="handleTransactionSubmit(event)" class="space-y-2.5 text-xs">
        <div>
          <label class="block text-slate-600 mb-1 font-medium">날짜</label>
          <input type="date" id="txDate" required class="w-full border border-slate-200 rounded p-2">
        </div>

        <div>
          <label class="block text-slate-600 mb-1 font-medium">금액 (원)</label>
          <input type="number" id="txAmount" required placeholder="0" class="w-full border border-slate-200 rounded p-2 text-sm font-bold text-slate-800">
        </div>

        <div id="singleAssetField">
          <label id="singleAssetLabel" class="block text-slate-600 mb-1 font-medium">출금 자산</label>
          <select id="txAsset" class="w-full border border-slate-200 rounded p-2"></select>
        </div>

        <div id="transferAssetField" class="grid grid-cols-2 gap-2 hidden">
          <div>
            <label class="block text-slate-600 mb-1 font-medium">보낸 자산 (출금)</label>
            <select id="txFromAsset" class="w-full border border-slate-200 rounded p-2"></select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">받는 자산 (입금)</label>
            <select id="txToAsset" class="w-full border border-slate-200 rounded p-2"></select>
          </div>
        </div>

        <div id="categoryField">
          <label class="block text-slate-600 mb-1 font-medium">카테고리</label>
          <select id="txCategory" class="w-full border border-slate-200 rounded p-2"></select>
        </div>

        <!-- [신규 기능] 내용/메모 자동완성 리스트 연동 -->
        <div>
          <label class="block text-slate-600 mb-1 font-medium">내용 / 메모 (이전 입력 자동완성)</label>
          <input type="text" id="txDescription" list="descAutocompleteList" required placeholder="예: 장보기, 점심식사" class="w-full border border-slate-200 rounded p-2">
          <datalist id="descAutocompleteList"></datalist>
        </div>

        <button type="submit" id="txSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded text-xs transition mt-1">
          저장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 거래 관리 팝업 모달 -->
  <div id="actionModal" class="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-t-2xl sm:rounded-xl p-4 space-y-2.5">
      <div class="text-center pb-2 border-b border-slate-100">
        <h4 id="actionModalTitle" class="text-xs font-bold text-slate-900">내역 관리</h4>
        <p id="actionModalSubtitle" class="text-[11px] text-slate-400 mt-0.5"></p>
      </div>
      <div class="space-y-1.5">
        <button onclick="triggerEditSelectedTx()" class="w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 rounded text-xs font-semibold text-slate-700 flex items-center justify-center gap-1.5">
          ✏️ 내역 수정하기
        </button>
        <button onclick="triggerCopySelectedTx()" class="w-full py-2 px-3 bg-blue-50 hover:bg-blue-100 rounded text-xs font-semibold text-blue-700 flex items-center justify-center gap-1.5">
          📋 같은 내용으로 복사해서 추가
        </button>
        <button onclick="triggerDeleteSelectedTx()" class="w-full py-2 px-3 bg-rose-50 hover:bg-rose-100 rounded text-xs font-semibold text-rose-600 flex items-center justify-center gap-1.5">
          🗑️ 내역 삭제
        </button>
      </div>
      <button onclick="closeModal('actionModal')" class="w-full py-1.5 text-xs text-slate-400 hover:text-slate-600 font-medium">
        닫기
      </button>
    </div>
  </div>

  <!-- 자산 추가 / 수정 모달 -->
  <div id="assetModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-xl p-4 space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 id="assetModalTitle" class="text-xs font-bold text-slate-900">새 자산 등록</h3>
        <button onclick="closeModal('assetModal')" class="text-slate-400 hover:text-slate-600 text-base font-bold">✕</button>
      </div>
      <form id="assetForm" onsubmit="handleAssetSubmit(event)" class="space-y-2.5 text-xs">
        <input type="hidden" id="editingAssetId" value="">
        <div>
          <label class="block text-slate-600 mb-1 font-medium">자산명</label>
          <input type="text" id="assetName" required placeholder="예: 생활비 통장, 비상금 적금, 아파트" class="w-full border border-slate-200 rounded p-2">
        </div>
        <div>
          <label class="block text-slate-600 mb-1 font-medium">자산 분류</label>
          <select id="assetType" class="w-full border border-slate-200 rounded p-2">
            <option value="생활비">생활비</option>
            <option value="비상금">비상금</option>
            <option value="투자">투자</option>
            <option value="부동산">부동산</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-600 mb-1 font-medium">초기 잔액 / 평가액 (원)</label>
          <input type="number" id="assetInitialBalance" required placeholder="0" class="w-full border border-slate-200 rounded p-2">
        </div>
        <button type="submit" id="assetSubmitBtn" class="w-full bg-slate-900 text-white font-bold py-2 rounded transition">
          자산 저장
        </button>
      </form>
    </div>
  </div>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyANLAY0TiNPjQpfc6kc6tAQDYYJD4ClIKw",
      authDomain: "dokyuwallet.firebaseapp.com",
      projectId: "dokyuwallet",
      storageBucket: "dokyuwallet.firebasestorage.app",
      messagingSenderId: "413064087271",
      appId: "1:413064087271:web:8819582abc3e89b2700442",
      measurementId: "G-E1M0XZMYT6"
    };

    const ASSET_CATEGORIES = ['생활비', '비상금', '투자', '부동산'];

    const DEFAULT_CATEGORIES = {
      expense: ['식비', '카페/간식', '생활/쇼핑', '주거/통신', '교통/차량', '의료/건강', '문화/여가', '경조사', '기타'],
      income: ['급여', '상여금', '부수입', '금융소득', '용돈', '기타']
    };

    const DEFAULT_ASSETS = [
      { id: 'ast_1', name: '생활비 통장', type: '생활비', initialBalance: 1500000, order: 0 },
      { id: 'ast_2', name: '비상금 통장', type: '비상금', initialBalance: 5000000, order: 1 },
      { id: 'ast_3', name: '투자 통장', type: '투자', initialBalance: 10000000, order: 2 }
    ];

    let state = {
      currentDate: new Date(),
      selectedDate: new Date().toISOString().slice(0, 10),
      currentType: 'expense',
      categories: JSON.parse(localStorage.getItem('budget_custom_cats')) || DEFAULT_CATEGORIES,
      assets: JSON.parse(localStorage.getItem('budget_assets')) || DEFAULT_ASSETS,
      transactions: JSON.parse(localStorage.getItem('budget_txs')) || [],
      selectedTxForAction: null,
      pickerYear: new Date().getFullYear(),
      chartPeriod: 'daily',
      // 디폴트: 잔액만 켜짐
      chartVisibility: { income: false, expense: false, balance: true },
      chartInstance: null,
      isFirebaseReady: false,
      db: null
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('txDate').value = state.selectedDate;
      initFirebaseAuto();
      sortAssets();
      updateAssetSelects();
      updateDescriptionAutocomplete();
      renderAll();
    });

    function sortAssets() {
      state.assets.sort((a, b) => (a.order !== undefined && b.order !== undefined) ? (a.order - b.order) : 0);
    }

    function initFirebaseAuto() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        state.db = firebase.firestore();
        state.isFirebaseReady = true;

        state.db.collection('transactions').onSnapshot(snapshot => {
          state.transactions = snapshot.docs.map(doc => doc.data());
          localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
          updateDescriptionAutocomplete();
          renderAll();
        }, err => console.error('거래 내역 동기화 오류:', err));

        state.db.collection('assets').onSnapshot(snapshot => {
          if (!snapshot.empty) {
            state.assets = snapshot.docs.map(doc => doc.data());
            sortAssets();
            localStorage.setItem('budget_assets', JSON.stringify(state.assets));
            updateAssetSelects();
            renderAll();
          } else {
            DEFAULT_ASSETS.forEach(a => state.db.collection('assets').doc(a.id).set(a));
          }
        }, err => console.error('자산 동기화 오류:', err));

        state.db.collection('settings').doc('categories').onSnapshot(doc => {
          if (doc.exists) {
            state.categories = doc.data();
            localStorage.setItem('budget_custom_cats', JSON.stringify(state.categories));
            populateCategories(state.currentType);
            renderSettings();
          } else {
            state.db.collection('settings').doc('categories').set(DEFAULT_CATEGORIES);
          }
        });

      } catch (err) {
        console.error('Firebase 초기화 실패:', err);
      }
    }

    function switchTab(tabName) {
      ['calendar', 'list', 'stats', 'assets', 'settings'].forEach(name => {
        const tabEl = document.getElementById(`tab-${name}`);
        const navEl = document.getElementById(`nav-${name}`);
        if (tabEl) tabEl.classList.toggle('hidden', name !== tabName);
        if (navEl) {
          navEl.classList.toggle('text-blue-600', name === tabName);
          navEl.classList.toggle('text-slate-400', name !== tabName);
        }
      });
      if (tabName === 'calendar') renderCalendar();
      if (tabName === 'list') renderListView();
      if (tabName === 'stats') {
        renderStatsSummary();
        renderStatsChart();
      }
      if (tabName === 'assets') renderAssets();
      if (tabName === 'settings') renderSettings();
    }

    function openModal(id) { 
      if (id === 'assetModal' && !document.getElementById('editingAssetId').value) {
        document.getElementById('assetModalTitle').innerText = '새 자산 등록';
        document.getElementById('assetSubmitBtn').innerText = '자산 저장';
        document.getElementById('assetName').value = '';
        document.getElementById('assetType').value = '생활비';
        document.getElementById('assetInitialBalance').value = '';
      }
      document.getElementById(id).classList.remove('hidden'); 
    }
    function closeModal(id) { 
      if (id === 'assetModal') {
        document.getElementById('editingAssetId').value = '';
      }
      document.getElementById(id).classList.add('hidden'); 
    }

    // --- [연·월 팝업 픽커] ---
    function openMonthPickerModal() {
      state.pickerYear = state.currentDate.getFullYear();
      renderMonthPicker();
      openModal('monthPickerModal');
    }

    function changePickerYear(delta) {
      state.pickerYear += delta;
      renderMonthPicker();
    }

    function renderMonthPicker() {
      document.getElementById('pickerYearTitle').innerText = `${state.pickerYear}년`;
      const grid = document.getElementById('pickerMonthGrid');
      grid.innerHTML = '';

      const currentYear = state.currentDate.getFullYear();
      const currentMonth = state.currentDate.getMonth();

      for (let m = 0; m < 12; m++) {
        const isCurrent = (state.pickerYear === currentYear && m === currentMonth);
        const btn = document.createElement('button');
        btn.className = `py-2 rounded text-xs font-semibold transition ${
          isCurrent ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white'
        }`;
        btn.innerText = `${m + 1}월`;
        btn.onclick = () => {
          state.currentDate = new Date(state.pickerYear, m, 1);
          closeModal('monthPickerModal');
          renderAll();
        };
        grid.appendChild(btn);
      }
    }

    function jumpToCurrentMonth() {
      const now = new Date();
      state.currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
      closeModal('monthPickerModal');
      renderAll();
    }

    function changeMonth(delta) {
      state.currentDate.setMonth(state.currentDate.getMonth() + delta);
      renderAll();
    }

    function formatCellAmount(num) {
      const abs = Math.abs(num);
      if (abs >= 100000000) {
        return (abs / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
      } else if (abs >= 10000) {
        const val = (abs / 10000);
        return (val >= 100 ? Math.round(val) : val.toFixed(1).replace(/\.0$/, '')) + '만';
      } else if (abs >= 1000) {
        return (abs / 1000).toFixed(0) + '천';
      }
      return abs.toString();
    }

    // [신규 기능] 내용/메모 자동완성 리스트 갱신
    function updateDescriptionAutocomplete() {
      const listEl = document.getElementById('descAutocompleteList');
      if (!listEl) return;
      const descs = Array.from(new Set(state.transactions.map(t => (t.description || '').trim()).filter(Boolean)));
      listEl.innerHTML = descs.slice(0, 50).map(d => `<option value="${d}">`).join('');
    }

    function openNewTxModal() {
      document.getElementById('editingTxId').value = '';
      document.getElementById('txModalTitle').innerText = '가계부 기록';
      document.getElementById('txSubmitBtn').innerText = '저장하기';
      document.getElementById('txDate').value = state.selectedDate;
      document.getElementById('txAmount').value = '';
      document.getElementById('txDescription').value = '';
      setTxType('expense');
      openModal('txModal');
    }

    function setTxType(type) {
      state.currentType = type;
      const bExp = document.getElementById('typeBtnExpense');
      const bInc = document.getElementById('typeBtnIncome');
      const bTrf = document.getElementById('typeBtnTransfer');
      const singleField = document.getElementById('singleAssetField');
      const transferField = document.getElementById('transferAssetField');
      const catField = document.getElementById('categoryField');
      const singleLabel = document.getElementById('singleAssetLabel');

      [bExp, bInc, bTrf].forEach(btn => btn.className = 'py-1.5 rounded text-slate-500');

      if (type === 'expense') {
        bExp.className = 'py-1.5 rounded bg-white text-rose-600 shadow-xs font-bold';
        singleField.classList.remove('hidden');
        transferField.classList.add('hidden');
        catField.classList.remove('hidden');
        singleLabel.innerText = '출금 자산';
        populateCategories('expense');
      } else if (type === 'income') {
        bInc.className = 'py-1.5 rounded bg-white text-blue-600 shadow-xs font-bold';
        singleField.classList.remove('hidden');
        transferField.classList.add('hidden');
        catField.classList.remove('hidden');
        singleLabel.innerText = '입금 자산';
        populateCategories('income');
      } else {
        bTrf.className = 'py-1.5 rounded bg-white text-purple-600 shadow-xs font-bold';
        singleField.classList.add('hidden');
        transferField.classList.remove('hidden');
        catField.classList.add('hidden');
      }
    }

    function populateCategories(type) {
      const select = document.getElementById('txCategory');
      const cats = state.categories[type] || [];
      select.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function updateAssetSelects() {
      sortAssets();
      const opts = state.assets.map(a => `<option value="${a.name}">${a.name} (${a.type || '생활비'})</option>`).join('');
      document.getElementById('txAsset').innerHTML = opts;
      document.getElementById('txFromAsset').innerHTML = opts;
      document.getElementById('txToAsset').innerHTML = opts;

      const chartSelect = document.getElementById('chartAssetSelect');
      if (chartSelect) {
        chartSelect.innerHTML = `<option value="ALL">전체 자산 (순자산 합산)</option>` + 
          state.assets.map(a => `<option value="${a.name}">${a.name}</option>`).join('');
      }

      populateCategories(state.currentType);
    }

    function calculateAssetBalances() {
      const balances = {};
      state.assets.forEach(a => balances[a.name] = Number(a.initialBalance || 0));

      state.transactions.forEach(t => {
        const amt = Number(t.amount);
        if (t.type === 'expense') {
          if (balances[t.fromAsset] !== undefined) balances[t.fromAsset] -= amt;
        } else if (t.type === 'income') {
          if (balances[t.toAsset] !== undefined) balances[t.toAsset] += amt;
        } else if (t.type === 'transfer') {
          if (balances[t.fromAsset] !== undefined) balances[t.fromAsset] -= amt;
          if (balances[t.toAsset] !== undefined) balances[t.toAsset] += amt;
        }
      });
      return balances;
    }

    function renderAll() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth() + 1;
      const formattedTitle = `${year}년 ${month}월`;

      document.getElementById('calendarSectionTitle').innerText = formattedTitle;
      document.getElementById('listMonthTitle').innerText = `${formattedTitle} 내역`;
      document.getElementById('statsSectionTitle').innerText = formattedTitle;

      renderCalendar();
      renderSelectedDayList();
      renderListView();
      renderStatsSummary();
      renderStatsChart();
      renderAssets();
      renderSettings();
    }

    // 1. 달력 렌더링
    function renderCalendar() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      let mIncTotal = 0;
      let mExpTotal = 0;

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="min-h-[74px] bg-slate-50/50"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTxs = state.transactions.filter(t => t.date === dateStr);
        
        let incSum = 0;
        let expSum = 0;
        dayTxs.forEach(t => {
          if (t.type === 'income') incSum += Number(t.amount);
          if (t.type === 'expense') expSum += Number(t.amount);
        });

        mIncTotal += incSum;
        mExpTotal += expSum;

        const net = incSum - expSum;
        const hasTx = incSum > 0 || expSum > 0;
        const isSelected = state.selectedDate === dateStr;
        const dayOfWeek = new Date(year, month, day).getDay();

        let dateColor = 'text-slate-700';
        if (dayOfWeek === 0) dateColor = 'text-rose-500';
        if (dayOfWeek === 6) dateColor = 'text-blue-500';

        const cell = document.createElement('div');
        cell.className = `min-h-[74px] p-1 flex flex-col justify-between cursor-pointer transition select-none ${
          isSelected ? 'bg-blue-50/80 ring-2 ring-inset ring-blue-500' : 'bg-white hover:bg-slate-50'
        }`;
        cell.onclick = () => {
          state.selectedDate = dateStr;
          document.getElementById('txDate').value = dateStr;
          renderCalendar();
          renderSelectedDayList();
        };

        let txHtml = '';
        if (hasTx) {
          const netSign = net > 0 ? '+' : (net < 0 ? '-' : '');
          const netColor = net > 0 ? 'text-blue-600' : (net < 0 ? 'text-rose-600' : 'text-slate-500');

          txHtml = `
            <div class="space-y-[1px] text-[10px] leading-tight text-right w-full font-semibold">
              ${incSum > 0 ? `<div class="text-blue-600 tracking-tighter">${formatCellAmount(incSum)}</div>` : ''}
              ${expSum > 0 ? `<div class="text-rose-600 tracking-tighter">${formatCellAmount(expSum)}</div>` : ''}
              <div class="${netColor} font-bold tracking-tighter border-t border-slate-100 pt-[1px]">${netSign}${formatCellAmount(net)}</div>
            </div>
          `;
        }

        cell.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="text-xs font-semibold ${isSelected ? 'text-blue-700 font-bold' : dateColor}">${day}</span>
          </div>
          ${txHtml}
        `;
        grid.appendChild(cell);
      }

      document.getElementById('monthSumIncome').innerText = mIncTotal.toLocaleString() + '원';
      document.getElementById('monthSumExpense').innerText = mExpTotal.toLocaleString() + '원';
      const mNet = mIncTotal - mExpTotal;
      const mNetEl = document.getElementById('monthSumNet');
      mNetEl.innerText = (mNet > 0 ? '+' : '') + mNet.toLocaleString() + '원';
      mNetEl.className = `text-xs font-bold ${mNet > 0 ? 'text-blue-600' : (mNet < 0 ? 'text-rose-600' : 'text-slate-700')}`;
    }

    // 선택 날짜 상세 리스트
    function renderSelectedDayList() {
      document.getElementById('selectedDateTitle').innerText = `${state.selectedDate} 내역`;
      const txs = state.transactions.filter(t => t.date === state.selectedDate);
      const listEl = document.getElementById('selectedDateList');
      const summaryEl = document.getElementById('selectedDateSummary');
      const countEl = document.getElementById('selectedDateCount');

      countEl.innerText = `총 ${txs.length}건`;

      if (txs.length === 0) {
        listEl.innerHTML = `<p class="text-center py-4 text-slate-400 text-xs">기록된 거래가 없습니다.</p>`;
        summaryEl.innerHTML = '';
        return;
      }

      let expTotal = 0;
      let incTotal = 0;

      listEl.innerHTML = txs.map(t => {
        const amt = Number(t.amount);
        let badge = '';
        let sign = '';
        let color = '';

        if (t.type === 'expense') {
          expTotal += amt;
          badge = `<span class="px-1 py-0.5 rounded bg-rose-100 text-rose-700 text-[10px]">지출</span>`;
          sign = '-';
          color = 'text-rose-600';
        } else if (t.type === 'income') {
          incTotal += amt;
          badge = `<span class="px-1 py-0.5 rounded bg-blue-100 text-blue-700 text-[10px]">수입</span>`;
          sign = '+';
          color = 'text-blue-600';
        } else {
          badge = `<span class="px-1 py-0.5 rounded bg-purple-100 text-purple-700 text-[10px]">이체</span>`;
          sign = '⇄';
          color = 'text-purple-600';
        }

        const info = t.type === 'transfer' ? `${t.fromAsset} ➔ ${t.toAsset}` : (t.category || t.fromAsset || t.toAsset);

        return `
          <div onclick="openTxActionModal('${t.id}')" class="py-2 px-1 rounded hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex justify-between items-center transition">
            <div class="flex items-center gap-1.5">
              ${badge}
              <div>
                <p class="font-semibold text-slate-800 text-xs">${t.description}</p>
                <p class="text-[10px] text-slate-400">${info}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="font-bold text-xs ${color}">${sign}${amt.toLocaleString()}원</span>
              <span class="block text-[10px] text-slate-300">관리 ➔</span>
            </div>
          </div>
        `;
      }).join('');

      const netSum = incTotal - expTotal;
      const netSign = netSum > 0 ? '+' : '';
      const netColor = netSum > 0 ? 'text-blue-600' : (netSum < 0 ? 'text-rose-600' : 'text-slate-800');

      summaryEl.innerHTML = `
        ${incTotal > 0 ? `<div class="text-slate-500 font-medium">수입 <span class="font-bold text-blue-600">+${incTotal.toLocaleString()}원</span></div>` : ''}
        ${expTotal > 0 ? `<div class="text-slate-500 font-medium">지출 <span class="font-bold text-rose-600">-${expTotal.toLocaleString()}원</span></div>` : ''}
        <div class="text-slate-600 font-semibold border-t border-slate-100 pt-0.5">합계 <span class="font-extrabold ${netColor}">${netSign}${netSum.toLocaleString()}원</span></div>
      `;
    }

    // 2. 내역 탭
    function renderListView() {
      const year = state.currentDate.getFullYear();
      const monthStr = `${year}-${String(state.currentDate.getMonth() + 1).padStart(2, '0')}`;
      const typeFilter = document.getElementById('listTypeFilter').value;

      let filtered = state.transactions.filter(t => t.date.startsWith(monthStr));
      if (typeFilter !== 'ALL') filtered = filtered.filter(t => t.type === typeFilter);

      filtered.sort((a, b) => b.date.localeCompare(a.date));

      const container = document.getElementById('fullTransactionList');
      if (filtered.length === 0) {
        container.innerHTML = `<p class="p-6 text-center text-xs text-slate-400">${year}년 ${state.currentDate.getMonth() + 1}월 내역이 없습니다.</p>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const amt = Number(t.amount);
        const isExp = t.type === 'expense';
        const isInc = t.type === 'income';
        const color = isExp ? 'text-rose-600' : (isInc ? 'text-blue-600' : 'text-purple-600');
        const sign = isExp ? '-' : (isInc ? '+' : '⇄');
        const info = t.type === 'transfer' ? `${t.fromAsset} ➔ ${t.toAsset}` : (t.category || '');

        return `

    function renderStatsChart() {
      const canvas = document.getElementById('financeChart');
      if (!canvas) return;

      const selectedAsset = document.getElementById('chartAssetSelect')?.value || 'ALL';
      const period = state.chartPeriod;
      const targetYear = state.currentDate.getFullYear();
      const targetMonth = state.currentDate.getMonth() + 1;

      let labels = [];
      let incomeData = [];
      let expenseData = [];
      let balanceData = [];

      const getInitialAssetSum = () => {
        if (selectedAsset === 'ALL') {
          return state.assets.reduce((sum, a) => sum + Number(a.initialBalance || 0), 0);
        }
        const found = state.assets.find(a => a.name === selectedAsset);
        return found ? Number(found.initialBalance || 0) : 0;
      };

      const getTxDelta = (t) => {
        const amt = Number(t.amount);
        if (selectedAsset === 'ALL') {
          if (t.type === 'income') return amt;
          if (t.type === 'expense') return -amt;
          return 0;
        } else {
          let delta = 0;
          if (t.toAsset === selectedAsset) delta += amt;
          if (t.fromAsset === selectedAsset) delta -= amt;
          return delta;
        }
      };

      const sortedTxs = [...state.transactions].sort((a, b) => a.date.localeCompare(b.date));

      if (period === 'daily') {
        document.getElementById('chartSubtitleInfo').innerText = `${targetYear}년 ${targetMonth}월 일별 (${selectedAsset === 'ALL' ? '전체' : selectedAsset})`;
        const daysInMonth = new Date(targetYear, targetMonth, 0).getDate();
        const monthPrefix = `${targetYear}-${String(targetMonth).padStart(2, '0')}`;

        let currentRunningBal = getInitialAssetSum();
        sortedTxs.forEach(t => {
          if (t.date < `${monthPrefix}-01`) {
            currentRunningBal += getTxDelta(t);
          }
        });

        for (let d = 1; d <= daysInMonth; d++) {
          const dayStr = `${monthPrefix}-${String(d).padStart(2, '0')}`;
          labels.push(`${d}일`);

          const dayTxs = sortedTxs.filter(t => t.date === dayStr);
          let inc = 0;
          let exp = 0;

          dayTxs.forEach(t => {
            const amt = Number(t.amount);
            if (selectedAsset === 'ALL') {
              if (t.type === 'income') inc += amt;
              if (t.type === 'expense') exp += amt;
            } else {
              if (t.toAsset === selectedAsset && t.type === 'income') inc += amt;
              if (t.fromAsset === selectedAsset && t.type === 'expense') exp += amt;
            }
            currentRunningBal += getTxDelta(t);
          });

          incomeData.push(inc);
          expenseData.push(exp);
          balanceData.push(currentRunningBal);
        }

      } else if (period === 'monthly') {
        document.getElementById('chartSubtitleInfo').innerText = `${targetYear}년 월별 (${selectedAsset === 'ALL' ? '전체' : selectedAsset})`;

        let currentRunningBal = getInitialAssetSum();
        sortedTxs.forEach(t => {
          if (t.date < `${targetYear}-01-01`) {
            currentRunningBal += getTxDelta(t);
          }
        });

        for (let m = 1; m <= 12; m++) {
          const mStr = `${targetYear}-${String(m).padStart(2, '0')}`;
          labels.push(`${m}월`);

          const monthTxs = sortedTxs.filter(t => t.date.startsWith(mStr));
          let inc = 0;
          let exp = 0;

          monthTxs.forEach(t => {
            const amt = Number(t.amount);
            if (selectedAsset === 'ALL') {
              if (t.type === 'income') inc += amt;
              if (t.type === 'expense') exp += amt;
            } else {
              if (t.toAsset === selectedAsset && t.type === 'income') inc += amt;
              if (t.fromAsset === selectedAsset && t.type === 'expense') exp += amt;
            }
            currentRunningBal += getTxDelta(t);
          });

          incomeData.push(inc);
          expenseData.push(exp);
          balanceData.push(currentRunningBal);
        }

      } else {
        document.getElementById('chartSubtitleInfo').innerText = `연도별 (${selectedAsset === 'ALL' ? '전체' : selectedAsset})`;
        const startYear = targetYear - 4;

        let currentRunningBal = getInitialAssetSum();
        sortedTxs.forEach(t => {
          if (t.date < `${startYear}-01-01`) {
            currentRunningBal += getTxDelta(t);
          }
        });

        for (let y = startYear; y <= targetYear; y++) {
          const yStr = String(y);
          labels.push(`${y}년`);

          const yearTxs = sortedTxs.filter(t => t.date.startsWith(yStr));
          let inc = 0;
          let exp = 0;

          yearTxs.forEach(t => {
            const amt = Number(t.amount);
            if (selectedAsset === 'ALL') {
              if (t.type === 'income') inc += amt;
              if (t.type === 'expense') exp += amt;
            } else {
              if (t.toAsset === selectedAsset && t.type === 'income') inc += amt;
              if (t.fromAsset === selectedAsset && t.type === 'expense') exp += amt;
            }
            currentRunningBal += getTxDelta(t);
          });

          incomeData.push(inc);
          expenseData.push(exp);
          balanceData.push(currentRunningBal);
        }
      }

      const datasets = [];

      if (state.chartVisibility.income) {
        datasets.push({
          type: 'bar',
          label: '수입',
          data: incomeData,
          backgroundColor: 'rgba(59, 130, 246, 0.75)',
          borderRadius: 2,
          order: 2
        });
      }

      if (state.chartVisibility.expense) {
        datasets.push({
          type: 'bar',
          label: '지출',
          data: expenseData,
          backgroundColor: 'rgba(244, 63, 94, 0.75)',
          borderRadius: 2,
          order: 3
        });
      }

      if (state.chartVisibility.balance) {
        datasets.push({
          type: 'line',
          label: '잔액',
          data: balanceData,
          borderColor: '#10b981',
          backgroundColor: 'rgba(16, 185, 129, 0.1)',
          borderWidth: 2,
          tension: 0.2,
          fill: false,
          pointRadius: period === 'daily' ? 1 : 3,
          order: 1
        });
      }

      if (state.chartInstance) {
        state.chartInstance.destroy();
      }

      state.chartInstance = new Chart(canvas, {
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.dataset.label}: ${Number(context.raw).toLocaleString()}원`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { font: { size: 9 }, maxRotation: 0 }
            },
            y: {
              grid: { color: 'rgba(226, 232, 240, 0.6)' },
              ticks: {
                font: { size: 9 },
                callback: function(value) {
                  if (Math.abs(value) >= 100000000) return (value / 100000000).toFixed(1) + '억';
                  if (Math.abs(value) >= 10000) return (value / 10000).toFixed(0) + '만';
                  return value;
                }
              }
            }
          }
        }
      });
    }

    // [신규 기능] 자산 순서 이동 로직
    async function moveAssetOrder(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.assets.length) return;

      const temp = state.assets[index];
      state.assets[index] = state.assets[targetIndex];
      state.assets[targetIndex] = temp;

      // order 인덱스 재부여
      state.assets.forEach((a, idx) => a.order = idx);

      if (state.isFirebaseReady) {
        const batch = state.db.batch();
        state.assets.forEach(a => {
          const ref = state.db.collection('assets').doc(a.id);
          batch.update(ref, { order: a.order });
        });
        await batch.commit();
      } else {
        localStorage.setItem('budget_assets', JSON.stringify(state.assets));
      }

      updateAssetSelects();
      renderAll();
    }

    // CSV 내보내기 & 가져오기
    function exportToCSV() {
      if (!state.transactions.length) {
        alert('내보낼 거래 내역이 없습니다.');
        return;
      }

      const headers = ['날짜', '유형', '금액', '내용', '카테고리', '출금자산', '입금자산'];
      const rows = state.transactions.map(t => [
        t.date || '',
        t.type === 'expense' ? '지출' : (t.type === 'income' ? '수입' : '이체'),
        t.amount || 0,
        `"${(t.description || '').replace(/"/g, '""')}"`,
        `"${(t.category || '').replace(/"/g, '""')}"`,
        `"${(t.fromAsset || '').replace(/"/g, '""')}"`,
        `"${(t.toAsset || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `가계부_내역_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importFromCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const text = e.target.result;
        const lines = text.split(/\r\n|\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) {
          alert('가져올 유효한 데이터가 없습니다.');
          return;
        }

        const newTxs = [];
        for (let i = 1; i < lines.length; i++) {
          const row = parseCSVLine(lines[i]);
          if (row.length < 4) continue;
          const [date, typeStr, amountStr, desc, cat, fromA, toA] = row;
          let type = 'expense';
          if (typeStr === '수입' || typeStr === 'income') type = 'income';
          else if (typeStr === '이체' || typeStr === 'transfer') type = 'transfer';

          newTxs.push({
            id: 'tx_csv_' + Date.now() + '_' + i,
            date: (date || '').trim(),
            type: type,
            amount: Number(amountStr.replace(/[^0-9.-]+/g, '')) || 0,
            description: (desc || '').trim(),
            category: (cat || (type === 'transfer' ? '이체' : '기타')).trim(),
            fromAsset: (fromA || '').trim(),
            toAsset: (toA || '').trim(),
            createdAt: new Date().toISOString()
          });
        }

        if (!newTxs.length) {
          alert('CSV 파일에서 올바른 거래 내역을 찾을 수 없습니다.');
          return;
        }

        if (!confirm(`총 ${newTxs.length}건의 거래 내역을 불러와 추가하시겠습니까?`)) {
          event.target.value = '';
          return;
        }

        if (state.isFirebaseReady) {
          const batch = state.db.batch();
          newTxs.forEach(tx => {
            const ref = state.db.collection('transactions').doc(tx.id);
            batch.set(ref, tx);
          });
          await batch.commit();
        } else {
          state.transactions.push(...newTxs);
          localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
          renderAll();
        }

        alert('CSV 데이터를 성공적으로 불러왔습니다.');
        event.target.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    function parseCSVLine(line) {
      const result = [];
      let start = 0;
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') {
          inQuotes = !inQuotes;
        } else if (line[i] === ',' && !inQuotes) {
          let field = line.substring(start, i).trim();
          if (field.startsWith('"') && field.endsWith('"')) {
            field = field.substring(1, field.length - 1).replace(/""/g, '"');
          }
          result.push(field);
          start = i + 1;
        }
      }
      let lastField = line.substring(start).trim();
      if (lastField.startsWith('"') && lastField.endsWith('"')) {
        lastField = lastField.substring(1, lastField.length - 1).replace(/""/g, '"');
      }
      result.push(lastField);
      return result;
    }

      if (!tx) return;
      closeModal('actionModal');

      document.getElementById('editingTxId').value = '';
      document.getElementById('txModalTitle').innerText = '내역 복사 추가';
      document.getElementById('txSubmitBtn').innerText = '복사본 저장';

      setTxType(tx.type || 'expense');
      document.getElementById('txDate').value = state.selectedDate;
      document.getElementById('txAmount').value = tx.amount;
      document.getElementById('txDescription').value = `${tx.description} (복사)`;

      if (tx.type === 'transfer') {
        document.getElementById('txFromAsset').value = tx.fromAsset || '';
        document.getElementById('txToAsset').value = tx.toAsset || '';
      } else {
        document.getElementById('txAsset').value = (tx.type === 'expense' ? tx.fromAsset : tx.toAsset) || '';
        document.getElementById('txCategory').value = tx.category || '';
      }

      openModal('txModal');
    }

    function triggerDeleteSelectedTx() {
      const tx = state.selectedTxForAction;
      if (!tx) return;
      closeModal('actionModal');
      deleteTransaction(tx.id);
    }

    async function handleTransactionSubmit(e) {
      e.preventDefault();
      const type = state.currentType;
      const editingId = document.getElementById('editingTxId').value;
      const txId = editingId || ('tx_' + Date.now());

      const txData = {
        id: txId,
        date: document.getElementById('txDate').value,
        type: type,
        amount: Number(document.getElementById('txAmount').value),
        description: document.getElementById('txDescription').value.trim(),
        category: type === 'transfer' ? '이체' : document.getElementById('txCategory').value,
        fromAsset: type === 'expense' || type === 'transfer' ? (type === 'transfer' ? document.getElementById('txFromAsset').value : document.getElementById('txAsset').value) : '',
        toAsset: type === 'income' || type === 'transfer' ? (type === 'transfer' ? document.getElementById('txToAsset').value : document.getElementById('txAsset').value) : '',
        updatedAt: new Date().toISOString()
      };

      if (!editingId) {
        txData.createdAt = new Date().toISOString();
      }

      if (type === 'transfer' && txData.fromAsset === txData.toAsset) {
        alert('출금 자산과 입금 자산은 서로 달라야 합니다.');
        return;
      }

      if (state.isFirebaseReady) {
        await state.db.collection('transactions').doc(txId).set(txData, { merge: true });
      } else {
        if (editingId) {
          const idx = state.transactions.findIndex(t => t.id === editingId);
          if (idx !== -1) state.transactions[idx] = txData;
        } else {
          state.transactions.push(txData);
        }
        localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
        renderAll();
      }

      document.getElementById('editingTxId').value = '';
      document.getElementById('txAmount').value = '';
      document.getElementById('txDescription').value = '';
      updateDescriptionAutocomplete();
      closeModal('txModal');
    }

    async function deleteTransaction(id) {
      if (!confirm('해당 내역을 삭제하시겠습니까?')) return;
      if (state.isFirebaseReady) {
        await state.db.collection('transactions').doc(id).delete();
      } else {
        state.transactions = state.transactions.filter(t => t.id !== id);
        localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
        renderAll();
      }
    }

    async function addCategory(type) {
      const input = document.getElementById(type === 'expense' ? 'newExpenseCatInput' : 'newIncomeCatInput');
      const val = input.value.trim();
      if (!val) return;

      if (!state.categories[type].includes(val)) {
        state.categories[type].push(val);
        if (state.isFirebaseReady) {
          await state.db.collection('settings').doc('categories').set(state.categories);
        } else {
          localStorage.setItem('budget_custom_cats', JSON.stringify(state.categories));
          renderSettings();
          populateCategories(state.currentType);
        }
      }
      input.value = '';
    }

    async function deleteCategory(type, cat) {
      if (!confirm(`'${cat}' 카테고리를 삭제하시겠습니까?`)) return;
      state.categories[type] = state.categories[type].filter(c => c !== cat);
      if (state.isFirebaseReady) {
        await state.db.collection('settings').doc('categories').set(state.categories);
      } else {
        localStorage.setItem('budget_custom_cats', JSON.stringify(state.categories));
        renderSettings();
        populateCategories(state.currentType);
      }
    }

    // 자산 등록 및 수정 핸들러
    async function handleAssetSubmit(e) {
      e.preventDefault();
      const editingId = document.getElementById('editingAssetId').value;
      const assetId = editingId || ('ast_' + Date.now());
      const newName = document.getElementById('assetName').value.trim();
      const newType = document.getElementById('assetType').value;
      const newBal = Number(document.getElementById('assetInitialBalance').value) || 0;

      if (editingId) {
        // 기존 자산 수정
        const target = state.assets.find(a => a.id === editingId);
        const oldName = target ? target.name : '';

        const updatedAsset = {
          id: editingId,
          name: newName,
          type: newType,
          initialBalance: newBal,
          order: target ? (target.order ?? 0) : 0
        };

        if (state.isFirebaseReady) {
          await state.db.collection('assets').doc(editingId).set(updatedAsset, { merge: true });

          // 자산명이 바뀐 경우, 기존 거래 내역의 fromAsset/toAsset 일괄 업데이트
          if (oldName && oldName !== newName) {
            const batch = state.db.batch();
            state.transactions.forEach(t => {
              let changed = false;
              const updateData = {};
              if (t.fromAsset === oldName) { updateData.fromAsset = newName; changed = true; }
              if (t.toAsset === oldName) { updateData.toAsset = newName; changed = true; }
              if (changed) {
                batch.update(state.db.collection('transactions').doc(t.id), updateData);
              }
            });
            await batch.commit();
          }
        } else {
          const idx = state.assets.findIndex(a => a.id === editingId);
          if (idx !== -1) state.assets[idx] = updatedAsset;
          if (oldName && oldName !== newName) {
            state.transactions.forEach(t => {
              if (t.fromAsset === oldName) t.fromAsset = newName;
              if (t.toAsset === oldName) t.toAsset = newName;
            });
            localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
          }
          localStorage.setItem('budget_assets', JSON.stringify(state.assets));
        }
      } else {
        // 새 자산 추가
        const newAsset = {
          id: assetId,
          name: newName,
          type: newType,
          initialBalance: newBal,
          order: state.assets.length
        };

        if (state.isFirebaseReady) {
          await state.db.collection('assets').doc(newAsset.id).set(newAsset);
        } else {
          state.assets.push(newAsset);
          localStorage.setItem('budget_assets', JSON.stringify(state.assets));
        }
      }

      document.getElementById('editingAssetId').value = '';
      document.getElementById('assetName').value = '';
      document.getElementById('assetInitialBalance').value = '';
      closeModal('assetModal');
      updateAssetSelects();
      renderAll();
    }

    async function deleteAsset(id) {
      if (!confirm('자산을 삭제하시겠습니까? 관련 거래 내역은 유지됩니다.')) return;
      if (state.isFirebaseReady) {
        await state.db.collection('assets').doc(id).delete();
      } else {
        state.assets = state.assets.filter(a => a.id !== id);
        localStorage.setItem('budget_assets', JSON.stringify(state.assets));
        updateAssetSelects();
        renderAll();
      }
    }
  </script>
</body>
</html>
