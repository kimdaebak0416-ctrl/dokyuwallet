<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>우리 둘만의 가계부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 아이폰 하단 홈 바(Safe Area) 완벽 대응 */
    .safe-bottom-nav {
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 1.5rem));
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-32">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <h1 class="text-lg font-bold text-slate-900">가계부</h1>
      <span id="syncStatusBadge" class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-medium">동기화 중</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openNewTxModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold shadow-sm transition">
        + 내역 추가
      </button>
      <button onclick="switchTab('settings')" class="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg">
        ⚙️
      </button>
    </div>
  </header>

  <!-- 메인 탭 컨테이너 -->
  <main class="max-w-xl mx-auto p-3 space-y-3">

    <!-- 1. 달력 탭 -->
    <section id="tab-calendar" class="space-y-3">
      <!-- 캘린더 메인 카드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        
        <!-- 연·월 선택 헤더 -->
        <div class="flex justify-between items-center px-4 py-3 border-b border-slate-100">
          <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg font-bold text-slate-600">&lt;</button>
          <button onclick="openMonthPickerModal()" class="flex items-center gap-1.5 font-bold text-base text-slate-800 hover:text-blue-600 transition">
            <span id="calendarTitle">2026년 11월</span>
            <span class="text-xs text-slate-400">▼</span>
          </button>
          <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg font-bold text-slate-600">&gt;</button>
        </div>

        <!-- 월간 수입 / 지출 / 합계 요약 바 -->
        <div class="grid grid-cols-3 text-center py-2.5 bg-slate-50 border-b border-slate-200 text-xs">
          <div>
            <span class="text-[10px] text-slate-400 block mb-0.5 font-medium">수입</span>
            <span class="text-xs font-bold text-blue-600" id="monthSumIncome">0</span>
          </div>
          <div class="border-x border-slate-200">
            <span class="text-[10px] text-slate-400 block mb-0.5 font-medium">지출</span>
            <span class="text-xs font-bold text-rose-600" id="monthSumExpense">0</span>
          </div>
          <div>
            <span class="text-[10px] text-slate-400 block mb-0.5 font-medium">합계</span>
            <span class="text-xs font-bold text-slate-700" id="monthSumNet">0</span>
          </div>
        </div>

        <!-- 요일 헤더 -->
        <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-400 py-1.5 border-b border-slate-100">
          <div class="text-rose-500">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="text-blue-500">토</div>
        </div>

        <!-- 날짜 그리드 (세로 크기 1.2배 확장: min-h-[78px]) -->
        <div id="calendarGrid" class="grid grid-cols-7 divide-x divide-y divide-slate-100 border-b border-slate-100"></div>
      </div>

      <!-- 선택된 날짜 상세 내역 목록 (우측 3단 정렬 헤더 적용) -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <div class="flex justify-between items-start mb-3 border-b border-slate-100 pb-2.5">
          <div>
            <h3 id="selectedDateTitle" class="text-sm font-bold text-slate-800">오늘의 내역</h3>
            <span id="selectedDateCount" class="text-[11px] text-slate-400 mt-0.5 block">0건</span>
          </div>
          <!-- 우측 수입/지출/합계 정렬 영역 -->
          <div id="selectedDateSummary" class="text-right text-xs space-y-0.5"></div>
        </div>
        <div id="selectedDateList" class="divide-y divide-slate-100 text-sm space-y-1"></div>
      </div>
    </section>

    <!-- 2. 내역 탭 -->
    <section id="tab-list" class="space-y-3 hidden">
      <div class="flex gap-2">
        <select id="listTypeFilter" onchange="renderListView()" class="bg-white border border-slate-300 rounded-lg text-xs px-3 py-2 w-full">
          <option value="ALL">전체 내역 (수입/지출/이체)</option>
          <option value="expense">지출만</option>
          <option value="income">수입만</option>
          <option value="transfer">이체만</option>
        </select>
      </div>
      <div id="fullTransactionList" class="bg-white rounded-2xl shadow-sm border border-slate-200 divide-y divide-slate-100 overflow-hidden"></div>
    </section>

    <!-- 3. 통계 탭 -->
    <section id="tab-stats" class="space-y-4 hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <h3 class="text-xs font-semibold text-slate-400 mb-2" id="statsMonthLabel">이번 달 현황</h3>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-blue-50 p-2.5 rounded-xl">
            <span class="text-xs text-blue-600 block mb-0.5 font-medium">수입</span>
            <span class="text-sm font-bold text-blue-700" id="statsTotalIncome">0원</span>
          </div>
          <div class="bg-rose-50 p-2.5 rounded-xl">
            <span class="text-xs text-rose-600 block mb-0.5 font-medium">지출</span>
            <span class="text-sm font-bold text-rose-700" id="statsTotalExpense">0원</span>
          </div>
          <div class="bg-emerald-50 p-2.5 rounded-xl">
            <span class="text-xs text-emerald-600 block mb-0.5 font-medium">순저축</span>
            <span class="text-sm font-bold text-emerald-700" id="statsNetSavings">0원</span>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-slate-800">지출 카테고리별 합계</h3>
          <span class="text-xs text-slate-400" id="statsExpenseCount">0건</span>
        </div>
        <div id="categoryStatsList" class="space-y-3"></div>
      </div>
    </section>

    <!-- 4. 자산 관리 탭 -->
    <section id="tab-assets" class="space-y-4 hidden">
      <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center">
          <div>
            <span class="text-xs text-slate-400 block mb-1">우리 순자산 총액</span>
            <span id="totalAssetSum" class="text-2xl font-bold tracking-tight">0원</span>
          </div>
          <button onclick="openModal('assetModal')" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3.5 py-2 rounded-xl transition font-medium border border-white/10">
            + 자산 추가
          </button>
        </div>
      </div>

      <div id="assetsCategoryGroups" class="space-y-4"></div>
    </section>

    <!-- 5. 설정 탭 -->
    <section id="tab-settings" class="space-y-5 hidden">
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-sm font-bold text-amber-900">자산 목록 초기화 & 정리</h3>
          <span class="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-semibold">정리도구</span>
        </div>
        <p class="text-xs text-amber-700 mb-3 leading-relaxed">
          이전에 등록된 구버전 중복 자산이 남아있다면 <b>생활비, 비상금, 투자</b> 기본 자산으로 재구성합니다. (거래 내역은 유지됩니다)
        </p>
        <button onclick="resetAssetsToDefault()" class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-sm">
          중복 자산 삭제 및 4대 분류로 초기화
        </button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
        <h3 class="text-sm font-bold text-slate-800">지출 카테고리 관리</h3>
        <div class="flex gap-2">
          <input type="text" id="newExpenseCatInput" placeholder="추가할 지출 카테고리 (예: 육아)" class="border border-slate-200 rounded-lg p-2 text-xs flex-1">
          <button onclick="addCategory('expense')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-medium">추가</button>
        </div>
        <div id="settingsExpenseCatList" class="flex flex-wrap gap-1.5 pt-1"></div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
        <h3 class="text-sm font-bold text-slate-800">수입 카테고리 관리</h3>
        <div class="flex gap-2">
          <input type="text" id="newIncomeCatInput" placeholder="추가할 수입 카테고리 (예: 배당금)" class="border border-slate-200 rounded-lg p-2 text-xs flex-1">
          <button onclick="addCategory('income')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-medium">추가</button>
        </div>
        <div id="settingsIncomeCatList" class="flex flex-wrap gap-1.5 pt-1"></div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-slate-800">등록된 전체 자산 관리</h3>
          <button onclick="openModal('assetModal')" class="text-xs text-blue-600 font-semibold">+ 자산 추가</button>
        </div>
        <div id="settingsAssetManageList" class="divide-y divide-slate-100 text-xs"></div>
      </div>
    </section>

  </main>

  <!-- 하단 고정 탭 바 (아이폰 Safe Area 대응으로 위쪽으로 키움) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-8 pt-3 safe-bottom-nav flex justify-between items-center max-w-xl mx-auto z-20 shadow-lg">
    <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center text-blue-600 transition">
      <span class="text-lg">📅</span>
      <span class="text-[11px] font-semibold mt-1">달력</span>
    </button>
    <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center text-slate-400 transition">
      <span class="text-lg">📝</span>
      <span class="text-[11px] font-semibold mt-1">내역</span>
    </button>
    <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center text-slate-400 transition">
      <span class="text-lg">📊</span>
      <span class="text-[11px] font-semibold mt-1">통계</span>
    </button>
    <button onclick="switchTab('assets')" id="nav-assets" class="flex flex-col items-center text-slate-400 transition">
      <span class="text-lg">💳</span>
      <span class="text-[11px] font-semibold mt-1">자산</span>
    </button>
  </nav>

  <!-- 연·월 고속 이동 팝업 픽커 모달 -->
  <div id="monthPickerModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 text-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800 text-xs">
        <span class="text-slate-400 font-medium">날짜 선택</span>
        <div class="flex items-center gap-3">
          <button onclick="jumpToCurrentMonth()" class="text-slate-300 hover:text-white font-semibold">이번 달</button>
          <button onclick="closeModal('monthPickerModal')" class="text-slate-400 hover:text-white text-base">✕</button>
        </div>
      </div>

      <div class="flex justify-between items-center px-4 py-1">
        <button onclick="changePickerYear(-1)" class="p-2 text-slate-400 hover:text-white font-bold text-lg">&lt;</button>
        <span id="pickerYearTitle" class="text-base font-bold text-white tracking-wide">2026년</span>
        <button onclick="changePickerYear(1)" class="p-2 text-slate-400 hover:text-white font-bold text-lg">&gt;</button>
      </div>

      <div class="grid grid-cols-4 gap-2 pt-1" id="pickerMonthGrid"></div>
    </div>
  </div>

  <!-- 거래 추가 / 수정 모달 -->
  <div id="txModal" class="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 id="txModalTitle" class="text-base font-bold text-slate-900">가계부 기록</h3>
        <button onclick="closeModal('txModal')" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>

      <input type="hidden" id="editingTxId" value="">

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
        <button type="button" onclick="setTxType('expense')" id="typeBtnExpense" class="py-2 rounded-lg bg-white text-rose-600 shadow-sm">지출</button>
        <button type="button" onclick="setTxType('income')" id="typeBtnIncome" class="py-2 rounded-lg text-slate-500">수입</button>
        <button type="button" onclick="setTxType('transfer')" id="typeBtnTransfer" class="py-2 rounded-lg text-slate-500">이체</button>
      </div>

      <form id="txForm" onsubmit="handleTransactionSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 mb-1 font-medium">날짜</label>
          <input type="date" id="txDate" required class="w-full border border-slate-200 rounded-lg p-2.5">
        </div>

        <div>
          <label class="block text-slate-600 mb-1 font-medium">금액 (원)</label>
          <input type="number" id="txAmount" required placeholder="0" class="w-full border border-slate-200 rounded-lg p-2.5 text-base font-bold text-slate-800">
        </div>

        <div id="singleAssetField">
          <label id="singleAssetLabel" class="block text-slate-600 mb-1 font-medium">출금 자산</label>
          <select id="txAsset" class="w-full border border-slate-200 rounded-lg p-2.5"></select>
        </div>

        <div id="transferAssetField" class="grid grid-cols-2 gap-2 hidden">
          <div>
            <label class="block text-slate-600 mb-1 font-medium">보낸 자산 (출금)</label>
            <select id="txFromAsset" class="w-full border border-slate-200 rounded-lg p-2.5"></select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">받는 자산 (입금)</label>
            <select id="txToAsset" class="w-full border border-slate-200 rounded-lg p-2.5"></select>
          </div>
        </div>

        <div id="categoryField">
          <label class="block text-slate-600 mb-1 font-medium">카테고리</label>
          <select id="txCategory" class="w-full border border-slate-200 rounded-lg p-2.5"></select>
        </div>

        <div>
          <label class="block text-slate-600 mb-1 font-medium">내용 / 메모</label>
          <input type="text" id="txDescription" required placeholder="예: 장보기, 점심식사" class="w-full border border-slate-200 rounded-lg p-2.5">
        </div>

        <button type="submit" id="txSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition mt-2">
          저장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 거래 항목 액션 시트 모달 (수정 / 복사 / 삭제) -->
  <div id="actionModal" class="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="text-center pb-2 border-b border-slate-100">
        <h4 id="actionModalTitle" class="text-sm font-bold text-slate-900">내역 관리</h4>
        <p id="actionModalSubtitle" class="text-xs text-slate-400 mt-0.5"></p>
      </div>
      <div class="space-y-2">
        <button onclick="triggerEditSelectedTx()" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold text-slate-700 flex items-center justify-center gap-2">
          ✏️ 내역 수정하기
        </button>
        <button onclick="triggerCopySelectedTx()" class="w-full py-2.5 px-4 bg-blue-50 hover:bg-blue-100 rounded-xl text-xs font-semibold text-blue-700 flex items-center justify-center gap-2">
          📋 같은 내용으로 복사해서 추가
        </button>
        <button onclick="triggerDeleteSelectedTx()" class="w-full py-2.5 px-4 bg-rose-50 hover:bg-rose-100 rounded-xl text-xs font-semibold text-rose-600 flex items-center justify-center gap-2">
          🗑️ 내역 삭제
        </button>
      </div>
      <button onclick="closeModal('actionModal')" class="w-full py-2 rounded-xl text-xs text-slate-400 hover:text-slate-600 font-medium">
        닫기
      </button>
    </div>
  </div>

  <!-- 자산 추가 모달 -->
  <div id="assetModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="text-sm font-bold text-slate-900">새 자산 등록</h3>
        <button onclick="closeModal('assetModal')" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>
      <form id="assetForm" onsubmit="handleAssetSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 mb-1 font-medium">자산명</label>
          <input type="text" id="assetName" required placeholder="예: 생활비 통장, 비상금 적금, 아파트" class="w-full border border-slate-200 rounded-lg p-2.5">
        </div>
        <div>
          <label class="block text-slate-600 mb-1 font-medium">자산 분류</label>
          <select id="assetType" class="w-full border border-slate-200 rounded-lg p-2.5">
            <option value="생활비">생활비</option>
            <option value="비상금">비상금</option>
            <option value="투자">투자</option>
            <option value="부동산">부동산</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-600 mb-1 font-medium">초기 잔액 / 평가액 (원)</label>
          <input type="number" id="assetInitialBalance" required placeholder="0" class="w-full border border-slate-200 rounded-lg p-2.5">
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl transition">
          자산 저장
        </button>
      </form>
    </div>
  </div>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyANLAY0TiNPjQpfc6kc6tAQDYYJD4ClIKw",
      authDomain: "dokyuwallet.firebaseapp.com",
      projectId: "dokyuwallet",
      storageBucket: "dokyuwallet.firebasestorage.app",
      messagingSenderId: "413064087271",
      appId: "1:413064087271:web:8819582abc3e89b2700442",
      measurementId: "G-E1M0XZMYT6"
    };

    const ASSET_CATEGORIES = ['생활비', '비상금', '투자', '부동산'];

    const DEFAULT_CATEGORIES = {
      expense: ['식비', '카페/간식', '생활/쇼핑', '주거/통신', '교통/차량', '의료/건강', '문화/여가', '경조사', '기타'],
      income: ['급여', '상여금', '부수입', '금융소득', '용돈', '기타']
    };

    const DEFAULT_ASSETS = [
      { id: 'ast_1', name: '생활비 통장', type: '생활비', initialBalance: 1500000 },
      { id: 'ast_2', name: '비상금 통장', type: '비상금', initialBalance: 5000000 },
      { id: 'ast_3', name: '투자 통장', type: '투자', initialBalance: 10000000 }
    ];

    let state = {
      currentDate: new Date(),
      selectedDate: new Date().toISOString().slice(0, 10),
      currentType: 'expense',
      categories: JSON.parse(localStorage.getItem('budget_custom_cats')) || DEFAULT_CATEGORIES,
      assets: JSON.parse(localStorage.getItem('budget_assets')) || DEFAULT_ASSETS,
      transactions: JSON.parse(localStorage.getItem('budget_txs')) || [],
      selectedTxForAction: null,
      pickerYear: new Date().getFullYear(),
      isFirebaseReady: false,
      db: null
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('txDate').value = state.selectedDate;
      initFirebaseAuto();
      updateAssetSelects();
      renderAll();
    });

    function initFirebaseAuto() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        state.db = firebase.firestore();
        state.isFirebaseReady = true;

        state.db.collection('transactions').onSnapshot(snapshot => {
          state.transactions = snapshot.docs.map(doc => doc.data());
          localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
          renderAll();
        }, err => console.error('거래 내역 동기화 오류:', err));

        state.db.collection('assets').onSnapshot(snapshot => {
          if (!snapshot.empty) {
            state.assets = snapshot.docs.map(doc => doc.data());
            localStorage.setItem('budget_assets', JSON.stringify(state.assets));
            updateAssetSelects();
            renderAll();
          } else {
            DEFAULT_ASSETS.forEach(a => state.db.collection('assets').doc(a.id).set(a));
          }
        }, err => console.error('자산 동기화 오류:', err));

        state.db.collection('settings').doc('categories').onSnapshot(doc => {
          if (doc.exists) {
            state.categories = doc.data();
            localStorage.setItem('budget_custom_cats', JSON.stringify(state.categories));
            populateCategories(state.currentType);
            renderSettings();
          } else {
            state.db.collection('settings').doc('categories').set(DEFAULT_CATEGORIES);
          }
        });

      } catch (err) {
        console.error('Firebase 초기화 실패:', err);
      }
    }

    async function resetAssetsToDefault() {
      if (!confirm('현재 저장된 자산 목록을 모두 지우고 [생활비, 비상금, 투자] 기본 자산으로 깔끔하게 재정렬하시겠습니까?\n(기존 거래 내역은 안전하게 유지됩니다)')) return;

      if (state.isFirebaseReady) {
        const snapshot = await state.db.collection('assets').get();
        const batch = state.db.batch();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();

        for (const ast of DEFAULT_ASSETS) {
          await state.db.collection('assets').doc(ast.id).set(ast);
        }
      } else {
        state.assets = [...DEFAULT_ASSETS];
        localStorage.setItem('budget_assets', JSON.stringify(state.assets));
      }

      alert('자산 목록이 깨끗하게 정리되었습니다.');
      updateAssetSelects();
      renderAll();
    }

    function switchTab(tabName) {
      ['calendar', 'list', 'stats', 'assets', 'settings'].forEach(name => {
        const tabEl = document.getElementById(`tab-${name}`);
        const navEl = document.getElementById(`nav-${name}`);
        if (tabEl) tabEl.classList.toggle('hidden', name !== tabName);
        if (navEl) {
          navEl.classList.toggle('text-blue-600', name === tabName);
          navEl.classList.toggle('text-slate-400', name !== tabName);
        }
      });
      if (tabName === 'calendar') renderCalendar();
      if (tabName === 'list') renderListView();
      if (tabName === 'stats') renderStats();
      if (tabName === 'assets') renderAssets();
      if (tabName === 'settings') renderSettings();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function openMonthPickerModal() {
      state.pickerYear = state.currentDate.getFullYear();
      renderMonthPicker();
      openModal('monthPickerModal');
    }

    function changePickerYear(delta) {
      state.pickerYear += delta;
      renderMonthPicker();
    }

    function renderMonthPicker() {
      document.getElementById('pickerYearTitle').innerText = `${state.pickerYear}년`;
      const grid = document.getElementById('pickerMonthGrid');
      grid.innerHTML = '';

      const currentYear = state.currentDate.getFullYear();
      const currentMonth = state.currentDate.getMonth();

      for (let m = 0; m < 12; m++) {
        const isCurrent = (state.pickerYear === currentYear && m === currentMonth);
        const btn = document.createElement('button');
        btn.className = `py-3 rounded-xl text-xs font-semibold transition ${
          isCurrent ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white'
        }`;
        btn.innerText = `${m + 1}월`;
        btn.onclick = () => {
          state.currentDate = new Date(state.pickerYear, m, 1);
          closeModal('monthPickerModal');
          renderCalendar();
          renderStats();
        };
        grid.appendChild(btn);
      }
    }

    function jumpToCurrentMonth() {
      const now = new Date();
      state.currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
      closeModal('monthPickerModal');
      renderCalendar();
      renderStats();
    }

    function formatCellAmount(num) {
      const abs = Math.abs(num);
      if (abs >= 100000000) {
        return (abs / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
      } else if (abs >= 10000) {
        const val = (abs / 10000);
        return (val >= 100 ? Math.round(val) : val.toFixed(1).replace(/\.0$/, '')) + '만';
      } else if (abs >= 1000) {
        return (abs / 1000).toFixed(0) + '천';
      }
      return abs.toString();
    }

    function openNewTxModal() {
      document.getElementById('editingTxId').value = '';
      document.getElementById('txModalTitle').innerText = '가계부 기록';
      document.getElementById('txSubmitBtn').innerText = '저장하기';
      document.getElementById('txDate').value = state.selectedDate;
      document.getElementById('txAmount').value = '';
      document.getElementById('txDescription').value = '';
      setTxType('expense');
      openModal('txModal');
    }

    function setTxType(type) {
      state.currentType = type;
      const bExp = document.getElementById('typeBtnExpense');
      const bInc = document.getElementById('typeBtnIncome');
      const bTrf = document.getElementById('typeBtnTransfer');
      const singleField = document.getElementById('singleAssetField');
      const transferField = document.getElementById('transferAssetField');
      const catField = document.getElementById('categoryField');
      const singleLabel = document.getElementById('singleAssetLabel');

      [bExp, bInc, bTrf].forEach(btn => btn.className = 'py-2 rounded-lg text-slate-500');

      if (type === 'expense') {
        bExp.className = 'py-2 rounded-lg bg-white text-rose-600 shadow-sm font-bold';
        singleField.classList.remove('hidden');
        transferField.classList.add('hidden');
        catField.classList.remove('hidden');
        singleLabel.innerText = '출금 자산';
        populateCategories('expense');
      } else if (type === 'income') {
        bInc.className = 'py-2 rounded-lg bg-white text-blue-600 shadow-sm font-bold';
        singleField.classList.remove('hidden');
        transferField.classList.add('hidden');
        catField.classList.remove('hidden');
        singleLabel.innerText = '입금 자산';
        populateCategories('income');
      } else {
        bTrf.className = 'py-2 rounded-lg bg-white text-purple-600 shadow-sm font-bold';
        singleField.classList.add('hidden');
        transferField.classList.remove('hidden');
        catField.classList.add('hidden');
      }
    }

    function populateCategories(type) {
      const select = document.getElementById('txCategory');
      const cats = state.categories[type] || [];
      select.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function updateAssetSelects() {
      const opts = state.assets.map(a => `<option value="${a.name}">${a.name} (${a.type || '생활비'})</option>`).join('');
      document.getElementById('txAsset').innerHTML = opts;
      document.getElementById('txFromAsset').innerHTML = opts;
      document.getElementById('txToAsset').innerHTML = opts;
      populateCategories(state.currentType);
    }

    function calculateAssetBalances() {
      const balances = {};
      state.assets.forEach(a => balances[a.name] = Number(a.initialBalance || 0));

      state.transactions.forEach(t => {
        const amt = Number(t.amount);
        if (t.type === 'expense') {
          if (balances[t.fromAsset] !== undefined) balances[t.fromAsset] -= amt;
        } else if (t.type === 'income') {
          if (balances[t.toAsset] !== undefined) balances[t.toAsset] += amt;
        } else if (t.type === 'transfer') {
          if (balances[t.fromAsset] !== undefined) balances[t.fromAsset] -= amt;
          if (balances[t.toAsset] !== undefined) balances[t.toAsset] += amt;
        }
      });
      return balances;
    }

    function renderAll() {
      renderCalendar();
      renderSelectedDayList();
      renderListView();
      renderStats();
      renderAssets();
      renderSettings();
    }

    function changeMonth(delta) {
      state.currentDate.setMonth(state.currentDate.getMonth() + delta);
      renderCalendar();
      renderStats();
    }

    // 달력 렌더링 (세로 높이 78px로 1.2배 확장)
    function renderCalendar() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();
      document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      let mIncTotal = 0;
      let mExpTotal = 0;

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="min-h-[78px] bg-slate-50/50"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTxs = state.transactions.filter(t => t.date === dateStr);
        
        let incSum = 0;
        let expSum = 0;
        dayTxs.forEach(t => {
          if (t.type === 'income') incSum += Number(t.amount);
          if (t.type === 'expense') expSum += Number(t.amount);
        });

        mIncTotal += incSum;
        mExpTotal += expSum;

        const net = incSum - expSum;
        const hasTx = incSum > 0 || expSum > 0;
        const isSelected = state.selectedDate === dateStr;
        const dayOfWeek = new Date(year, month, day).getDay();

        let dateColor = 'text-slate-700';
        if (dayOfWeek === 0) dateColor = 'text-rose-500';
        if (dayOfWeek === 6) dateColor = 'text-blue-500';

        const cell = document.createElement('div');
        cell.className = `min-h-[78px] p-1.5 flex flex-col justify-between cursor-pointer transition select-none ${
          isSelected ? 'bg-blue-50/80 ring-2 ring-inset ring-blue-500' : 'bg-white hover:bg-slate-50'
        }`;
        cell.onclick = () => {
          state.selectedDate = dateStr;
          document.getElementById('txDate').value = dateStr;
          renderCalendar();
          renderSelectedDayList();
        };

        let txHtml = '';
        if (hasTx) {
          const netSign = net > 0 ? '+' : (net < 0 ? '-' : '');
          const netColor = net > 0 ? 'text-blue-600' : (net < 0 ? 'text-rose-600' : 'text-slate-500');

          txHtml = `
            <div class="space-y-[1px] text-[10px] leading-tight text-right w-full font-semibold">
              ${incSum > 0 ? `<div class="text-blue-600 tracking-tighter">${formatCellAmount(incSum)}</div>` : ''}
              ${expSum > 0 ? `<div class="text-rose-600 tracking-tighter">${formatCellAmount(expSum)}</div>` : ''}
              <div class="${netColor} font-bold tracking-tighter border-t border-slate-100 pt-[1px]">${netSign}${formatCellAmount(net)}</div>
            </div>
          `;
        }

        cell.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="text-xs font-semibold ${isSelected ? 'text-blue-700 font-bold' : dateColor}">${day}</span>
          </div>
          ${txHtml}
        `;
        grid.appendChild(cell);
      }

      document.getElementById('monthSumIncome').innerText = mIncTotal.toLocaleString() + '원';
      document.getElementById('monthSumExpense').innerText = mExpTotal.toLocaleString() + '원';
      const mNet = mIncTotal - mExpTotal;
      const mNetEl = document.getElementById('monthSumNet');
      mNetEl.innerText = (mNet > 0 ? '+' : '') + mNet.toLocaleString() + '원';
      mNetEl.className = `text-xs font-bold ${mNet > 0 ? 'text-blue-600' : (mNet < 0 ? 'text-rose-600' : 'text-slate-700')}`;
    }

    // 선택 날짜 상세 리스트 (우측 3단 깔끔 정렬 구현)
    function renderSelectedDayList() {
      document.getElementById('selectedDateTitle').innerText = `${state.selectedDate} 내역`;
      const txs = state.transactions.filter(t => t.date === state.selectedDate);
      const listEl = document.getElementById('selectedDateList');
      const summaryEl = document.getElementById('selectedDateSummary');
      const countEl = document.getElementById('selectedDateCount');

      countEl.innerText = `총 ${txs.length}건`;

      if (txs.length === 0) {
        listEl.innerHTML = `<p class="text-center py-6 text-slate-400 text-xs">기록된 거래가 없습니다.</p>`;
        summaryEl.innerHTML = '';
        return;
      }

      let expTotal = 0;
      let incTotal = 0;

      listEl.innerHTML = txs.map(t => {
        const amt = Number(t.amount);
        let badge = '';
        let sign = '';
        let color = '';

        if (t.type === 'expense') {
          expTotal += amt;
          badge = `<span class="px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 text-[10px]">지출</span>`;
          sign = '-';
          color = 'text-rose-600';
        } else if (t.type === 'income') {
          incTotal += amt;
          badge = `<span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 text-[10px]">수입</span>`;
          sign = '+';
          color = 'text-blue-600';
        } else {
          badge = `<span class="px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 text-[10px]">이체</span>`;
          sign = '⇄';
          color = 'text-purple-600';
        }

        const info = t.type === 'transfer' ? `${t.fromAsset} ➔ ${t.toAsset}` : (t.category || t.fromAsset || t.toAsset);

        return `
          <div onclick="openTxActionModal('${t.id}')" class="py-2.5 px-2 -mx-2 rounded-xl hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex justify-between items-center transition">
            <div class="flex items-center gap-2">
              ${badge}
              <div>
                <p class="font-semibold text-slate-800 text-xs">${t.description}</p>
                <p class="text-[10px] text-slate-400">${info}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="font-bold text-xs ${color}">${sign}${amt.toLocaleString()}원</span>
              <span class="block text-[10px] text-slate-300">관리 ➔</span>
            </div>
          </div>
        `;
      }).join('');

      const netSum = incTotal - expTotal;
      const netSign = netSum > 0 ? '+' : '';
      const netColor = netSum > 0 ? 'text-blue-600' : (netSum < 0 ? 'text-rose-600' : 'text-slate-800');

      // 우측 정렬 수입, 지출, 합계 표시
      summaryEl.innerHTML = `
        ${incTotal > 0 ? `<div class="text-slate-500 font-medium">수입 <span class="font-bold text-blue-600">+${incTotal.toLocaleString()}원</span></div>` : ''}
        ${expTotal > 0 ? `<div class="text-slate-500 font-medium">지출 <span class="font-bold text-rose-600">-${expTotal.toLocaleString()}원</span></div>` : ''}
        <div class="text-slate-600 font-semibold border-t border-slate-100 pt-0.5">합계 <span class="font-extrabold ${netColor}">${netSign}${netSum.toLocaleString()}원</span></div>
      `;
    }

    function renderListView() {
      const typeFilter = document.getElementById('listTypeFilter').value;
      let filtered = [...state.transactions];
      if (typeFilter !== 'ALL') filtered = filtered.filter(t => t.type === typeFilter);

      filtered.sort((a, b) => b.date.localeCompare(a.date));

      const container = document.getElementById('fullTransactionList');
      if (filtered.length === 0) {
        container.innerHTML = `<p class="p-6 text-center text-xs text-slate-400">내역이 없습니다.</p>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const amt = Number(t.amount);
        const isExp = t.type === 'expense';
        const isInc = t.type === 'income';
        const color = isExp ? 'text-rose-600' : (isInc ? 'text-blue-600' : 'text-purple-600');
        const sign = isExp ? '-' : (isInc ? '+' : '⇄');
        const info = t.type === 'transfer' ? `${t.fromAsset} ➔ ${t.toAsset}` : (t.category || '');

        return `
          <div onclick="openTxActionModal('${t.id}')" class="p-3 hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex justify-between items-center text-xs transition">
            <div>
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-slate-400 text-[10px]">${t.date}</span>
                <span class="font-semibold text-slate-700">${t.description}</span>
              </div>
              <div class="text-[11px] text-slate-400">${info}</div>
            </div>
            <div class="text-right">
              <span class="font-bold ${color}">${sign}${amt.toLocaleString()}원</span>
              <span class="block text-[10px] text-slate-300">관리 ➔</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderStats() {
      const year = state.currentDate.getFullYear();
      const monthStr = `${year}-${String(state.currentDate.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('statsMonthLabel').innerText = `${year}년 ${state.currentDate.getMonth() + 1}월 현황`;

      const monthlyTxs = state.transactions.filter(t => t.date.startsWith(monthStr));

      let inc = 0;
      let exp = 0;
      const catTotals = {};

      monthlyTxs.forEach(t => {
        const amt = Number(t.amount);
        if (t.type === 'income') inc += amt;
        if (t.type === 'expense') {
          exp += amt;
          const cat = t.category || '기타';
          catTotals[cat] = (catTotals[cat] || 0) + amt;
        }
      });

      document.getElementById('statsTotalIncome').innerText = `${inc.toLocaleString()}원`;
      document.getElementById('statsTotalExpense').innerText = `${exp.toLocaleString()}원`;
      document.getElementById('statsNetSavings').innerText = `${(inc - exp).toLocaleString()}원`;

      const catListEl = document.getElementById('categoryStatsList');
      const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
      document.getElementById('statsExpenseCount').innerText = `총 ${sortedCats.length}개 분류`;

      if (sortedCats.length === 0) {
        catListEl.innerHTML = `<p class="text-center py-4 text-xs text-slate-400">지출 내역이 없습니다.</p>`;
      } else {
        catListEl.innerHTML = sortedCats.map(([cat, amount]) => {
          const pct = exp > 0 ? ((amount / exp) * 100).toFixed(1) : 0;
          return `
            <div class="space-y-1">
              <div class="flex justify-between text-xs">
                <span class="font-medium text-slate-700">${cat}</span>
                <span class="font-bold text-slate-900">${amount.toLocaleString()}원 (${pct}%)</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div class="bg-rose-500 h-2 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function renderAssets() {
      const balances = calculateAssetBalances();
      let total = 0;
      Object.values(balances).forEach(v => total += v);
      document.getElementById('totalAssetSum').innerText = `${total.toLocaleString()}원`;

      const categoryTheme = {
        '생활비': { badge: 'bg-emerald-100 text-emerald-800' },
        '비상금': { badge: 'bg-blue-100 text-blue-800' },
        '투자': { badge: 'bg-purple-100 text-purple-800' },
        '부동산': { badge: 'bg-amber-100 text-amber-800' }
      };

      const container = document.getElementById('assetsCategoryGroups');
      container.innerHTML = '';

      ASSET_CATEGORIES.forEach(category => {
        const assetsInCat = state.assets.filter(a => (a.type || '생활비') === category);
        let subtotal = 0;
        assetsInCat.forEach(a => subtotal += (balances[a.name] || 0));

        const theme = categoryTheme[category] || { badge: 'bg-slate-100 text-slate-800' };

        const section = document.createElement('div');
        section.className = 'bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3';

        let innerCardsHtml = '';
        if (assetsInCat.length === 0) {
          innerCardsHtml = `<p class="text-xs text-slate-400 py-1">등록된 ${category} 자산이 없습니다.</p>`;
        } else {
          innerCardsHtml = `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${assetsInCat.map(a => {
                const bal = balances[a.name] || 0;
                return `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 flex justify-between items-center">
                    <div>
                      <p class="text-xs font-semibold text-slate-700">${a.name}</p>
                      <p class="text-sm font-bold text-slate-900 mt-0.5">${bal.toLocaleString()}원</p>
                    </div>
                    <button onclick="deleteAsset('${a.id}')" class="text-slate-300 hover:text-rose-500 text-xs px-1">✕</button>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        section.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
            <div class="flex items-center gap-2">
              <span class="text-xs px-2 py-0.5 rounded-full font-bold ${theme.badge}">${category}</span>
              <span class="text-xs text-slate-400">${assetsInCat.length}개</span>
            </div>
            <div class="text-right">
              <span class="text-[11px] text-slate-400 block leading-tight">소계</span>
              <span class="text-sm font-bold text-slate-800">${subtotal.toLocaleString()}원</span>
            </div>
          </div>
          ${innerCardsHtml}
        `;

        container.appendChild(section);
      });
    }

    function renderSettings() {
      const expList = document.getElementById('settingsExpenseCatList');
      if (expList) {
        expList.innerHTML = (state.categories.expense || []).map(cat => `
          <span class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 border border-rose-100">
            ${cat}
            <button onclick="deleteCategory('expense', '${cat}')" class="hover:text-rose-900 font-bold ml-0.5">✕</button>
          </span>
        `).join('');
      }

      const incList = document.getElementById('settingsIncomeCatList');
      if (incList) {
        incList.innerHTML = (state.categories.income || []).map(cat => `
          <span class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 border border-blue-100">
            ${cat}
            <button onclick="deleteCategory('income', '${cat}')" class="hover:text-blue-900 font-bold ml-0.5">✕</button>
          </span>
        `).join('');
      }

      const assetList = document.getElementById('settingsAssetManageList');
      if (assetList) {
        assetList.innerHTML = state.assets.map(a => `
          <div class="py-2.5 flex justify-between items-center">
            <div>
              <span class="font-semibold text-slate-800">${a.name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 ml-1">${a.type || '생활비'}</span>
              <p class="text-[11px] text-slate-400">초기 잔액: ${Number(a.initialBalance || 0).toLocaleString()}원</p>
            </div>
            <button onclick="deleteAsset('${a.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-medium">삭제</button>
          </div>
        `).join('');
      }
    }

    function openTxActionModal(id) {
      const tx = state.transactions.find(t => t.id === id);
      if (!tx) return;
      state.selectedTxForAction = tx;

      document.getElementById('actionModalTitle').innerText = tx.description;
      document.getElementById('actionModalSubtitle').innerText = `${tx.date} · ${Number(tx.amount).toLocaleString()}원`;
      openModal('actionModal');
    }

    function triggerEditSelectedTx() {
      const tx = state.selectedTxForAction;
      if (!tx) return;
      closeModal('actionModal');

      document.getElementById('editingTxId').value = tx.id;
      document.getElementById('txModalTitle').innerText = '내역 수정';
      document.getElementById('txSubmitBtn').innerText = '수정 완료';

      setTxType(tx.type || 'expense');
      document.getElementById('txDate').value = tx.date;
      document.getElementById('txAmount').value = tx.amount;
      document.getElementById('txDescription').value = tx.description;

      if (tx.type === 'transfer') {
        document.getElementById('txFromAsset').value = tx.fromAsset || '';
        document.getElementById('txToAsset').value = tx.toAsset || '';
      } else {
        document.getElementById('txAsset').value = (tx.type === 'expense' ? tx.fromAsset : tx.toAsset) || '';
        document.getElementById('txCategory').value = tx.category || '';
      }

      openModal('txModal');
    }

    function triggerCopySelectedTx() {
      const tx = state.selectedTxForAction;
      if (!tx) return;
      closeModal('actionModal');

      document.getElementById('editingTxId').value = '';
      document.getElementById('txModalTitle').innerText = '내역 복사 추가';
      document.getElementById('txSubmitBtn').innerText = '복사본 저장';

      setTxType(tx.type || 'expense');
      document.getElementById('txDate').value = state.selectedDate;
      document.getElementById('txAmount').value = tx.amount;
      document.getElementById('txDescription').value = `${tx.description} (복사)`;

      if (tx.type === 'transfer') {
        document.getElementById('txFromAsset').value = tx.fromAsset || '';
        document.getElementById('txToAsset').value = tx.toAsset || '';
      } else {
        document.getElementById('txAsset').value = (tx.type === 'expense' ? tx.fromAsset : tx.toAsset) || '';
        document.getElementById('txCategory').value = tx.category || '';
      }

      openModal('txModal');
    }

    function triggerDeleteSelectedTx() {
      const tx = state.selectedTxForAction;
      if (!tx) return;
      closeModal('actionModal');
      deleteTransaction(tx.id);
    }

    async function handleTransactionSubmit(e) {
      e.preventDefault();
      const type = state.currentType;
      const editingId = document.getElementById('editingTxId').value;
      const txId = editingId || ('tx_' + Date.now());

      const txData = {
        id: txId,
        date: document.getElementById('txDate').value,
        type: type,
        amount: Number(document.getElementById('txAmount').value),
        description: document.getElementById('txDescription').value,
        category: type === 'transfer' ? '이체' : document.getElementById('txCategory').value,
        fromAsset: type === 'expense' || type === 'transfer' ? (type === 'transfer' ? document.getElementById('txFromAsset').value : document.getElementById('txAsset').value) : '',
        toAsset: type === 'income' || type === 'transfer' ? (type === 'transfer' ? document.getElementById('txToAsset').value : document.getElementById('txAsset').value) : '',
        updatedAt: new Date().toISOString()
      };

      if (!editingId) {
        txData.createdAt = new Date().toISOString();
      }

      if (type === 'transfer' && txData.fromAsset === txData.toAsset) {
        alert('출금 자산과 입금 자산은 서로 달라야 합니다.');
        return;
      }

      if (state.isFirebaseReady) {
        await state.db.collection('transactions').doc(txId).set(txData, { merge: true });
      } else {
        if (editingId) {
          const idx = state.transactions.findIndex(t => t.id === editingId);
          if (idx !== -1) state.transactions[idx] = txData;
        } else {
          state.transactions.push(txData);
        }
        localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
        renderAll();
      }

      document.getElementById('editingTxId').value = '';
      document.getElementById('txAmount').value = '';
      document.getElementById('txDescription').value = '';
      closeModal('txModal');
    }

    async function deleteTransaction(id) {
      if (!confirm('해당 내역을 삭제하시겠습니까?')) return;
      if (state.isFirebaseReady) {
        await state.db.collection('transactions').doc(id).delete();
      } else {
        state.transactions = state.transactions.filter(t => t.id !== id);
        localStorage.setItem('budget_txs', JSON.stringify(state.transactions));
        renderAll();
      }
    }

    async function addCategory(type) {
      const input = document.getElementById(type === 'expense' ? 'newExpenseCatInput' : 'newIncomeCatInput');
      const val = input.value.trim();
      if (!val) return;

      if (!state.categories[type].includes(val)) {
        state.categories[type].push(val);
        if (state.isFirebaseReady) {
          await state.db.collection('settings').doc('categories').set(state.categories);
        } else {
          localStorage.setItem('budget_custom_cats', JSON.stringify(state.categories));
          renderSettings();
          populateCategories(state.currentType);
        }
      }
      input.value = '';
    }

    async function deleteCategory(type, cat) {
      if (!confirm(`'${cat}' 카테고리를 삭제하시겠습니까?`)) return;
      state.categories[type] = state.categories[type].filter(c => c !== cat);
      if (state.isFirebaseReady) {
        await state.db.collection('settings').doc('categories').set(state.categories);
      } else {
        localStorage.setItem('budget_custom_cats', JSON.stringify(state.categories));
        renderSettings();
        populateCategories(state.currentType);
      }
    }

    async function handleAssetSubmit(e) {
      e.preventDefault();
      const newAsset = {
        id: 'ast_' + Date.now(),
        name: document.getElementById('assetName').value.trim(),
        type: document.getElementById('assetType').value,
        initialBalance: Number(document.getElementById('assetInitialBalance').value) || 0
      };

      if (state.isFirebaseReady) {
        await state.db.collection('assets').doc(newAsset.id).set(newAsset);
      } else {
        state.assets.push(newAsset);
        localStorage.setItem('budget_assets', JSON.stringify(state.assets));
        updateAssetSelects();
        renderAll();
      }

      document.getElementById('assetName').value = '';
      document.getElementById('assetInitialBalance').value = '';
      closeModal('assetModal');
    }

    async function deleteAsset(id) {
      if (!confirm('자산을 삭제하시겠습니까? 관련 거래 내역은 유지됩니다.')) return;
      if (state.isFirebaseReady) {
        await state.db.collection('assets').doc(id).delete();
      } else {
        state.assets = state.assets.filter(a => a.id !== id);
        localStorage.setItem('budget_assets', JSON.stringify(state.assets));
        updateAssetSelects();
        renderAll();
      }
    }
  </script>
</body>
</html>
